version: "3.11"

services:
  db:
    image: postgres:16-alpine
    container_name: instech-db
    environment:
      POSTGRES_USER: instech
      POSTGRES_PASSWORD: instech
      POSTGRES_DB: instech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instech"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instech-api
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://instech:instech@db:5432/instech
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instech-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8502:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://instech:instech@db:5432/instech
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
